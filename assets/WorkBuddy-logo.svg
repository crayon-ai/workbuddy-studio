<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF8EF"/>
      <stop offset="1" stop-color="#FCE6D6"/>
    </linearGradient>
    <linearGradient id="tab" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6A56B"/>
      <stop offset="1" stop-color="#EF7E4C"/>
    </linearGradient>
  </defs>

  <!-- 圆角方形奶油底 -->
  <rect x="32" y="32" width="960" height="960" rx="200" fill="url(#bg)"/>

  <!-- 散布的马卡龙色圆点 -->
  <circle cx="220" cy="236" r="34" fill="#FF5C7A"/>
  <circle cx="806" cy="210" r="24" fill="#B8A8E0"/>
  <circle cx="830" cy="800" r="30" fill="#F6A56B"/>
  <circle cx="190" cy="800" r="22" fill="#B8A8E0"/>

  <!-- 中央手账笔记本 -->
  <rect x="252" y="240" width="520" height="544" rx="48" fill="#FFFFFF"/>
  <rect x="252" y="240" width="520" height="544" rx="48" fill="none" stroke="#F2E3D0" stroke-width="6"/>

  <!-- 顶部线圈（马卡龙色） -->
  <circle cx="352" cy="240" r="20" fill="#EF7E4C"/>
  <circle cx="452" cy="240" r="20" fill="#FF5C7A"/>
  <circle cx="552" cy="240" r="20" fill="#B8A8E0"/>
  <circle cx="652" cy="240" r="20" fill="#F6A56B"/>

  <!-- 手账横线 -->
  <line x1="316" y1="360" x2="708" y2="360" stroke="#F2E3D0" stroke-width="14" stroke-linecap="round"/>
  <line x1="316" y1="452" x2="708" y2="452" stroke="#F2E3D0" stroke-width="14" stroke-linecap="round"/>
  <line x1="316" y1="544" x2="708" y2="544" stroke="#F2E3D0" stroke-width="14" stroke-linecap="round"/>
  <line x1="316" y1="636" x2="560" y2="636" stroke="#F2E3D0" stroke-width="14" stroke-linecap="round"/>

  <!-- 右下角橙色标签贴纸 -->
  <rect x="596" y="640" width="120" height="88" rx="20" fill="url(#tab)"/>
  <line x1="620" y1="664" x2="692" y2="664" stroke="#FFF6EC" stroke-width="10" stroke-linecap="round"/>
  <line x1="620" y1="700" x2="692" y2="700" stroke="#FFF6EC" stroke-width="10" stroke-linecap="round"/>
</svg>
